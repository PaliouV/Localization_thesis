# Όλες οι ρυθμίσεις του particle_filter.py (15 Νοε 2026).
#
# Χωρίς flags, το φίλτρο τρέχει με ό,τι γράφει εδώ. Κάθε ρύθμιση έχει και flag με το ίδιο όνομα
# (η κάτω παύλα γίνεται παύλα), που την αλλάζει μόνο για εκείνο το τρέξιμο:
#     python3 particle_filter.py                                  # όπως είναι το αρχείο
#     python3 particle_filter.py --receiver m8t --lanes           # άλλος δέκτης, με λωρίδες
#     python3 particle_filter.py --lanes --no-lane-type           # οι διακόπτες κλείνουν με --no-...
#     python3 particle_filter.py --lane-sigma 0.5 --particles 500
# Στο τέλος κάθε τρεξίματος τυπώνονται οι ρυθμίσεις που χρησιμοποιήθηκαν τελικά.
# Το πώς βγήκε κάθε νούμερο (δοκιμές, πηγές) είναι στο pf_sensors_only_notes/notes.md και στο git log.

# ── Τι τρέχουμε ──────────────────────────────────────────────────────────────
receiver: f9p            # δέκτης GPS: f9p (σύγχρονος) ή m8t (παλιός)
csv: drive_2026-10-30_20-45-55.csv   # καταγραφή, από τον φάκελο drives/
seed: 0                  # τα «ζάρια»: ίδιο seed → ίδιο αποτέλεσμα
particles: 1000          # πόσα σωματίδια

# ── Τι είναι ανοιχτό ─────────────────────────────────────────────────────────
lanes: false             # κάμερα λωρίδων (αλλιώς μόνο GPS + γυροσκόπιο + τροχοί)
lane_source: fake        # fake = ψεύτικη κάμερα από τον χάρτη· detector = το CSV του ανιχνευτή
lane_type: true          # με λωρίδες: χρήση του είδους γραμμής
lane_angle: true         # με λωρίδες: χρήση της γωνίας λωρίδας
compass: false           # πυξίδα της μονάδας IMU: μέτρηση κατεύθυνσης 1 φορά το δευτερόλεπτο
compass_start: true      # με πυξίδα: τα σωματίδια ξεκινούν γύρω από την ένδειξή της (αλλιώς τυχαία κατεύθυνση)

# ── Ζωντανή εικόνα ───────────────────────────────────────────────────────────
view:
  show: false            # παράθυρο με τον χάρτη (pf_view.py)
  start: 0               # από ποιο λεπτό της καταγραφής αρχίζει να ζωγραφίζει

# ── Τι «πιστεύει» το φίλτρο ──────────────────────────────────────────────────
filter:
  # Ανά δέκτη. pos_sigma: άπλωμα των σωματιδίων στην αρχή (m). gps_sigma: πόσο εμπιστεύεται το GPS (m).
  # heading_gate: η κάμερα χρησιμοποιείται μόνο αφού βρεθεί η κατεύθυνση (0,94 ≈ 20° άπλωμα, 0,985 ≈ 10°).
  # Ρύθμιση 5–9 Νοε 2026 (tune_pf.py, evaluate_pf.py).
  # lane_jitter (m): σκόρπισμα μετά από κάθε διόρθωση της κάμερας (ιδέα: Χριστοδούλου 2026). Στον M8T μεγαλύτερο, για να
  # μη «κολλάει» το φίλτρο σίγουρο σε λάθος θέση: ρύθμιση 19 Νοε 2026 (try_stuck_fixes.py, 5 καταγραφές × 10 seeds):
  # M8T 3,33 → 1,87 m, σωστή λωρίδα 88,6 → 93,7%· στον F9P το 0,5 χειροτέρευε (0,92 → 1,47 m), άρα μένει 0,1.
  f9p: {pos_sigma: 3, gps_sigma: 12, heading_gate: 0.94, lane_jitter: 0.1}
  m8t: {pos_sigma: 5, gps_sigma: 200, heading_gate: 0.985, lane_jitter: 0.5}
  safety: 2                  # σ ταχύτητας και στροφής του φίλτρου = θόρυβος των αισθητήρων (sensors) × safety
  velocity_sigma: null       # m/s· κενό = safety × speed_noise
  turn_rate_sigma: null      # rad/s· κενό = safety × θόρυβος γυροσκοπίου
  lane_sigma: 1.0            # m: πόσο εμπιστεύεται την απόσταση από τη γραμμή
  lane_every: 20             # βήματα: η κάμερα χρησιμοποιείται 1 φορά το δευτερόλεπτο (20 × 0,05 s)
  lane_type_wrong: 0.2       # πιθανότητα η κάμερα να είπε λάθος είδος γραμμής
  lane_angle_sigma: 1.5      # μοίρες: πόσο εμπιστεύεται τη γωνία λωρίδας
  lane_angle_outlier: 0.1    # πιθανότητα η γωνία να είναι εντελώς λάθος (στροφές, διασταυρώσεις)
  compass_sigma: 15          # μοίρες: πόσο εμπιστεύεται την πυξίδα. Ρύθμιση 15 Νοε 2026 (tune_compass.py)
  compass_every: 20          # βήματα: η πυξίδα χρησιμοποιείται 1 φορά το δευτερόλεπτο (20 × 0,05 s)

# ── Ο «κόσμος»: θόρυβος που προσθέτουμε στους αισθητήρες ─────────────────────
# Το φίλτρο ξέρει μόνο τα νούμερα του datasheet (τα ίδια αυτά), όχι το τι έβγαλαν τα ζάρια.
sensors:
  speed_noise: 0.05          # m/s: αισθητήρας τροχών (Gao 2006, Πίνακας 2)
  wheel_scale_sigma: 0.005   # λάθος κλίμακας των τροχών, σταθερό ανά διαδρομή (0,5%· πηγές ⚠️ θέλουν έλεγχο)
  wheel_scale: null          # κενό = τυχαίο με το παραπάνω σ· αλλιώς σταθερή τιμή (π.χ. 0.01 = +1%)
  gyro_noise_density: 0.03   # °/s/√Hz: γυροσκόπιο Xsens MTi-10 (datasheet σ. 2)
  gyro_bias_stability: 18    # °/h: σταθερή απόκλιση του γυροσκοπίου σε όλη τη διαδρομή (ίδιο datasheet)

# ── Ο «κόσμος»: GPS (μόνο διακόπτες· τα νούμερα του θορύβου είναι στο gps_noise_v2.py) ──
gps:
  gps_zones: true            # true = ζώνες της πόλης (MILD / MODERATE / STRONG)· false = όλη η πόλη ίδια
  gps_level: MODERATE        # με gps_zones false: ποιο επίπεδο παντού
  gps_warm_start: true       # το λάθος του GPS ξεκινά από τη συνηθισμένη του τιμή, όχι από 0

# ── Ο «κόσμος»: πυξίδα (compass_noise.py) ───────────────────────────────────
# Αργό λάθος, ίδιο σε όλη την πόλη (δεν ακολουθεί τις ζώνες του GPS). Πηγές και υπολογισμός: compass_noise.py.
compass_noise:
  compass_noise_sigma: 9.8       # μοίρες: τυπικό λάθος (UrbanNav 9,8°· Godha 2005: 8,5–12°· Cui 2024: 12,3°)
  compass_noise_tau: 130         # s: πόσο αργά αλλάζει το λάθος (UrbanNav: ομοιότητα 0,70 μετά από 60 s)

# ── Ο «κόσμος»: κάμερα λωρίδων (lane_camera.py) ─────────────────────────────
camera:
  camera_noise: 0.15             # m: λάθος απόστασης σε κάθε μέτρηση (Tao 2016)
  camera_offset_max: 0.10        # m: σταθερό λάθος ανά πλευρά, τυχαίο έως ± τόσο (Tao 2016)
  camera_extra_loss: 0.0         # πιθανότητα να χαθεί επιπλέον μια μέτρηση (για πειράματα)
  camera_angle_noise: 1.0        # μοίρες: λάθος γωνίας σε κάθε μέτρηση (⚠️ χωρίς πηγή)
  # Τα παρακάτω ισχύουν μόνο για την ψεύτικη κάμερα (lane_source fake)· μιμούνται τον ανιχνευτή (10 Νοε 2026).
  camera_angle_tail_prob: 0.10   # πόσο συχνά η γωνία έχει και ένα μεγάλο λάθος
  camera_angle_tail: 5.0         # μοίρες: μέγεθος του μεγάλου λάθους
  camera_angle_available: 0.65   # σε πόσες εικόνες με γραμμή υπάρχει γωνία
  camera_solid_as_solid: 0.85    # η συνεχής γραμμή φαίνεται συνεχής
  camera_solid_as_broken: 0.08   # η συνεχής γραμμή φαίνεται διακεκομμένη (αλλιώς «δεν ξέρω»)
  camera_broken_as_broken: 0.99  # η διακεκομμένη φαίνεται διακεκομμένη (αλλιώς «δεν ξέρω»)
